{% extends "common/base.html" %}
{% import "common/macros.html" as m with context %}
{% block title %}{{ t('auth.reset_title') }} · {{ app_name }}{% endblock %}
{% block content %}
<div class="auth"><div class="card">
  <h1>{{ t('auth.reset_title') }}</h1>
  <form method="post" class="stack">{{ m.csrf() }}
    <div><label for="password">{{ t('lbl.password') }}</label><input class="input" id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></div>
    <div><label for="password2">{{ t('lbl.password2') }}</label><input class="input" id="password2" name="password2" type="password" minlength="8" autocomplete="new-password" required></div>
    <button class="btn btn-primary btn-block" type="submit">{{ t('btn.save') }}</button>
  </form>
</div></div>
{% endblock %}
